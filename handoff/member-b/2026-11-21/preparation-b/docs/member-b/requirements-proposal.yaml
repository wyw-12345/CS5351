- id: REQ-INV-001
  type: invariant
  statement: Final persisted score equals the deterministic calculator result; model totals never override it.
  fit_criterion: {metric: authority_escape_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_model_total_cannot_override'}
  priority: Must
  source: Group allocation sections 1 and 5; project specification safety boundary
  tradeoff: Sacrifice model discretion for reproducible scores.
  status: proposed
- id: REQ-INV-002
  type: invariant
  statement: Missing, duplicate, unknown or uncertain criterion advice must escalate without a numeric final grade or persistence.
  fit_criterion: {metric: unsafe_automatic_grade_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_invalid_advice_escalates'}
  priority: Must
  source: Group allocation safety boundary
  tradeoff: More human review for zero silent default scores.
  status: proposed
- id: REQ-INV-003
  type: invariant
  statement: No grade is persisted without authentic human approval bound to the exact submission, rubric and advice.
  fit_criterion: {metric: unauthorized_write_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_unapproved_write_is_rejected'}
  priority: Must
  source: Group allocation architecture grade-store boundary
  tradeoff: Approval latency in exchange for accountable grade writes.
  status: proposed
- id: REQ-INV-004
  type: invariant
  statement: Reject nonfinite or boolean numbers, invalid weights, out-of-range scores and mismatched criteria before calculating or writing.
  fit_criterion: {metric: accepted_invalid_numeric_input_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_invalid_numeric_inputs_rejected'}
  priority: Must
  source: B analysis of weighted score safety boundary
  tradeoff: Strict validation instead of permissive coercion.
  status: proposed
- id: REQ-INV-005
  type: invariant
  statement: Scores are deterministic Decimal percentages rounded once to two decimal places using ROUND_HALF_UP.
  fit_criterion: {metric: differing_results_for_identical_input_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_exact_weighted_score'}
  priority: Must
  source: B analysis of deterministic-authoritative requirement
  tradeoff: Fixed arithmetic and rounding policy limits numeric flexibility.
  status: proposed
- id: REQ-INV-006
  type: invariant
  statement: Every persisted grade preserves advisory scores, authoritative score, rubric and essay digests and human reviewer identity in the same durable record.
  fit_criterion: {metric: incomplete_audit_record_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_audit_records_both_sources'}
  priority: Must
  source: Group allocation B direction and audit requirement
  tradeoff: Additional storage with privacy-safe hashes rather than essay text.
  status: proposed
- id: REQ-INV-007
  type: invariant
  statement: The advisory feedback component has no grade-store write authority and cannot execute instructions embedded in essays or returned text.
  fit_criterion: {metric: advisory_side_effect_or_injection_escape_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_prompt_injection_stays_advisory'}
  priority: Must
  source: Group allocation AI read-only and no direct write contract
  tradeoff: More orchestration code in exchange for restricted AI authority.
  status: proposed
- id: REQ-INV-008
  type: invariant
  statement: Retrying an approved identical submission is idempotent; conflicting content under the same submission ID is rejected without overwriting the original.
  fit_criterion: {metric: duplicate_or_overwritten_grade_count, threshold: 0, verification: 'test/offline/test_authority_boundary.py::AuthorityTests.test_retry_is_idempotent'}
  priority: Must
  source: B analysis of audit consistency and retries
  tradeoff: Explicit conflict handling instead of last-write-wins.
  status: proposed
