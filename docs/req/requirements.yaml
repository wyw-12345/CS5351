# GradeAide consolidated requirements registry (D1, member C).
# Status: proposed baseline for D review. No human approval is claimed here.
# Source proposals: docs/member-a/requirements-candidates.yaml,
# docs/member-b/requirements-proposal.yaml, docs/member-e/requirements-proposal.yaml.
# ID decisions: docs/req/requirement-id-map.yaml.
# Machine validation: docs/req/req-schema.json; evidence in docs/req/evidence/.

- id: REQ-FUNC-001
  type: functional
  statement: "A teacher can import one UTF-8 essay and one rubric containing 1 to 10 criteria; the system rejects malformed, oversized, ambiguous or non-finite input instead of coercing it."
  fit_criterion:
    metric: "invalid_import_accepted_count"
    threshold: "0"
    verification: "test/offline/test_calculator.py::CalculatorTests.test_invalid_rubric_rejected; test/offline/test_calculator.py::CalculatorTests.test_file_bounds_encoding_and_essay; test/offline/test_calculator.py::CalculatorTests.test_json_duplicates_and_nonfinite_rejected"
  priority: Must
  source: "Project brief D1; C functional analysis; A docs/member-a/interface-contract.md and src/contracts.py"
  tradeoff: "Strict bounded input rejects ambiguous files instead of guessing or silently truncating them."
  status: proposed
  owner: C
  notes: "The working implementation uses a rubric object with id, version and criteria; D must freeze the final exchange shape."

- id: REQ-FUNC-002
  type: functional
  statement: "For every rubric criterion the AI feedback component returns advisory text feedback, a suggested score, a confidence value and an evidence quote derived from the supplied essay."
  fit_criterion:
    metric: "feedback_contract_violation_count"
    threshold: "0"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_valid_feedback_and_request_contract"
  priority: Must
  source: "Project brief sections 1 and 3; C user story US-002; A feedback_engine.py"
  tradeoff: "A real provider dependency and latency are accepted in exchange for genuine AI feedback rather than canned text."
  status: proposed
  owner: C

- id: REQ-FUNC-003
  type: functional
  statement: "Model advice is accepted only when every rubric criterion appears exactly once with a known ID, a finite in-range suggested score, a confidence of at least 0.80 and no client-supplied final score that overrides the calculator."
  fit_criterion:
    metric: "invalid_advice_accepted_count"
    threshold: "0"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_reject_final_score_extra_unknown_duplicate_and_missing_criteria; test/offline/test_feedback.py::FeedbackTests.test_uncertain_null_is_an_escalation_not_a_zero_score"
  priority: Must
  source: "C functional analysis; B REQ-INV-002; A feedback_engine.validate_feedback"
  tradeoff: "Strict schema validation rejects creative but unusable model output and asks a human to review."
  status: proposed
  owner: C

- id: REQ-FUNC-004
  type: functional
  statement: "The deterministic calculator converts accepted criterion scores into one final percentage using the rubric weights, with exact arithmetic and a single final rounding to two decimal places using ROUND_HALF_UP."
  fit_criterion:
    metric: "final_score_calculation_mismatch_count"
    threshold: "0"
    verification: "test/offline/test_calculator.py::CalculatorTests.test_weighted_result_and_bounds; test/offline/test_calculator.py::CalculatorTests.test_exact_half_cent_after_recurring_division; test/offline/test_calculator.py::CalculatorTests.test_different_maxima_rounding_and_external_context"
  priority: Must
  source: "Project brief safety boundary; C functional analysis; A src/score_calculator.py"
  tradeoff: "Fixed arithmetic and rounding policy remove numerical discretion in exchange for reproducible grades."
  status: proposed
  owner: C

- id: REQ-FUNC-005
  type: functional
  statement: "Creating a grade proposal stores the essay, rubric and validated advisory advice as pending review and never creates a final grade before an authenticated human approval."
  fit_criterion:
    metric: "grades_created_before_human_approval"
    threshold: "0"
    verification: "test/offline/test_store.py::StoreTests.test_proposal_has_no_grade_and_human_change_is_audited; test/offline/test_authority_boundary.py::AuthorityTests.test_unapproved_write_is_rejected"
  priority: Must
  source: "Project brief authority boundary; C functional analysis; A grade_store.create"
  tradeoff: "The teacher must perform an explicit approval step instead of receiving an automatic final grade."
  status: proposed
  owner: C

- id: REQ-FUNC-006
  type: functional
  statement: "Approving a proposal recomputes the final score from the calculator, binds the approval to the exact proposal hash and persists an immutable audit record with the reviewer identity, accepted scores, timestamp and calculator version."
  fit_criterion:
    metric: "incomplete_or_unapproved_grade_record_count"
    threshold: "0"
    verification: "test/offline/test_store.py::StoreTests.test_missing_approval_details_and_stale_hash_are_rejected; test/offline/test_store.py::StoreTests.test_failed_audit_insert_rolls_back_status_and_grade; test/offline/test_store.py::StoreTests.test_escalation_requires_every_score_and_reason"
  priority: Must
  source: "C functional analysis; B REQ-INV-003 and REQ-INV-006; A grade_store.approve"
  tradeoff: "Approval latency and review effort are accepted in exchange for accountable, auditable grade writes."
  status: proposed
  owner: C

- id: REQ-FUNC-007
  type: functional
  statement: "A teacher can retrieve a pending or approved record and see both the advisory feedback and the authoritative final score; an unknown ID is refused and a missing database is not created by a read-only show command."
  fit_criterion:
    metric: "record_lookup_contract_violation_count"
    threshold: "0"
    verification: "test/offline/test_store.py::StoreTests.test_unknown_id_is_refused; test/offline/test_cli.py::CliTests.test_missing_database_show_does_not_create_file"
  priority: Must
  source: "C functional analysis; C user story US-005"
  tradeoff: "Read-only inspection never mutates state, at the cost of an explicit error when no database exists."
  status: proposed
  owner: C

- id: REQ-FUNC-008
  type: functional
  statement: "When advice is missing, duplicated, unknown, uncertain, below the confidence threshold, over budget or affected by a provider error, the workflow escalates to a human and neither invents a score nor writes a final grade."
  fit_criterion:
    metric: "unsafe_automatic_grade_count"
    threshold: "0"
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_invalid_advice_escalates; test/offline/test_feedback.py::FeedbackTests.test_input_and_monetary_budget_block_before_transport; test/offline/test_feedback.py::FeedbackTests.test_context_boundary_counts_utf8_bytes"
  priority: Must
  source: "Project brief safety boundary; C functional analysis; B REQ-INV-002"
  tradeoff: "More human review and visible failures are preferred over silent default scores."
  status: proposed
  owner: C

- id: REQ-FUNC-009
  type: functional
  statement: "Retrying an approved identical submission is idempotent and returns the original record; reusing a submission identifier with different essay, rubric or advice content is rejected without overwriting the original."
  fit_criterion:
    metric: "duplicate_or_overwritten_grade_count"
    threshold: "0"
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_retry_is_idempotent; test/offline/test_store.py::StoreTests.test_duplicate_approval_cannot_overwrite_history"
  priority: Must
  source: "C functional analysis; B REQ-INV-008"
  tradeoff: "Explicit conflict handling is preferred over last-write-wins convenience."
  status: proposed
  owner: C

- id: REQ-FUNC-010
  type: functional
  statement: "The command-line operator can create a proposal, approve it with an explicit reviewer identity and reason, and show the result across separate processes without hidden network calls or credential storage."
  fit_criterion:
    metric: "cli_operator_lifecycle_regression_count"
    threshold: "0"
    verification: "test/offline/test_cli.py::CliTests.test_separate_process_restart_approval_and_duplicate_rejection; test/offline/test_cli.py::CliTests.test_invalid_fixture_envelope_escalates_without_traceback"
  priority: Must
  source: "C functional analysis; A src/cli.py; C user story US-006"
  tradeoff: "A small explicit CLI is preferred over a larger UI that would add unreviewed surface area."
  status: proposed
  owner: C

- id: REQ-INV-001
  type: invariant
  statement: "The final persisted score equals the deterministic calculator output for the accepted scores and rubric; model totals never override or replace it."
  fit_criterion:
    metric: "authority_escape_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_model_total_cannot_override; test/offline/test_store.py::StoreTests.test_proposal_has_no_grade_and_human_change_is_audited"
  priority: Must
  source: "B proposal REQ-INV-001; project brief safety boundary; C consolidated"
  tradeoff: "Model discretion is sacrificed for reproducible and auditable scores."
  status: proposed
  owner: B

- id: REQ-INV-002
  type: invariant
  statement: "Missing, duplicate, unknown or uncertain criterion advice must escalate without a numeric final grade and without persistence of an approved grade."
  fit_criterion:
    metric: "unsafe_automatic_grade_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_invalid_advice_escalates; test/offline/test_feedback.py::FeedbackTests.test_uncertain_null_is_an_escalation_not_a_zero_score"
  priority: Must
  source: "B proposal REQ-INV-002; project brief safety boundary; C consolidated"
  tradeoff: "Additional human review is accepted to eliminate silent numeric defaults."
  status: proposed
  owner: B

- id: REQ-INV-003
  type: invariant
  statement: "No grade is persisted without authentic human approval bound to the exact submission, rubric and advice; a client-supplied name, flag or boolean is not authentication. This also absorbs E's authenticated-verifier proposal."
  fit_criterion:
    metric: "unauthorized_write_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_unapproved_write_is_rejected; test/offline/test_store.py::StoreTests.test_missing_approval_details_and_stale_hash_are_rejected"
  priority: Must
  source: "B proposal REQ-INV-003; E proposal REQ-SEC-003 (merged); project brief authority boundary"
  tradeoff: "Approval latency and verifier integration are accepted in exchange for accountable grade writes."
  status: proposed
  owner: B

- id: REQ-INV-004
  type: invariant
  statement: "The system rejects non-finite or boolean numbers, invalid weights, out-of-range scores, duplicate criteria and mismatched criterion IDs before calculating or writing any grade."
  fit_criterion:
    metric: "accepted_invalid_numeric_input_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_invalid_numeric_inputs_rejected; test/offline/test_calculator.py::CalculatorTests.test_invalid_scores_rejected"
  priority: Must
  source: "B proposal REQ-INV-004; C consolidated; A contracts.py"
  tradeoff: "Strict validation is preferred over permissive coercion."
  status: proposed
  owner: B

- id: REQ-INV-005
  type: invariant
  statement: "Identical essay, rubric and accepted scores always produce the same final percentage using exact arithmetic and exactly one round-half-up step to two decimal places; intermediate rounding is forbidden."
  fit_criterion:
    metric: "differing_results_for_identical_input_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_exact_weighted_score; test/offline/test_calculator.py::CalculatorTests.test_exact_half_cent_after_recurring_division"
  priority: Must
  source: "B proposal REQ-INV-005; A exact Fraction implementation; C resolution wording"
  tradeoff: "A fixed arithmetic and rounding policy limits numeric flexibility."
  status: proposed
  owner: B
  notes: "B proposed Decimal; A implements exact Fraction with an integer half-up step. C keeps the observable rule implementation-neutral and records the difference for D."

- id: REQ-INV-006
  type: invariant
  statement: "Every persisted grade preserves the advisory scores, authoritative score, rubric and essay digests, and human reviewer identity in one durable record that can be reconstructed after restart."
  fit_criterion:
    metric: "incomplete_audit_record_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_audit_records_both_sources; test/offline/test_store.py::StoreTests.test_reopen_preserves_exact_record"
  priority: Must
  source: "B proposal REQ-INV-006; project brief audit requirement; C consolidated"
  tradeoff: "Additional storage and hashing are accepted for a reconstructable audit trail."
  status: proposed
  owner: B

- id: REQ-INV-007
  type: invariant
  statement: "The advisory feedback component has no grade-store write authority and cannot execute instructions embedded in essays or model text; prompt injection remains advisory. This absorbs E's no-write and injection proposals."
  fit_criterion:
    metric: "advisory_side_effect_or_injection_escape_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_prompt_injection_stays_advisory; test/governance/test_gates.py::GateTests.test_forbidden_feedback_import"
