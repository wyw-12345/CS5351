  status: proposed
  owner: C

- id: REQ-QUAL-005
  type: quality
  statement: "The durable audit record does not create a second raw copy of the essay; it identifies the essay by hash while the working proposal remains the only payload that contains the text."
  fit_criterion:
    metric: "raw_essay_copies_in_audit_record"
    threshold: "0"
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_audit_records_both_sources (field check to be strengthened by B/A)"
  priority: Should
  source: "C privacy analysis; project brief privacy and audit requirements; pending D/E review"
  tradeoff: "Hash-only audit records reduce exposure but cannot reproduce the essay text by themselves."
  status: proposed
  owner: C
  notes: "TBC: the current test checks audit fields but does not explicitly assert absence of a second essay copy; B/A must add that assertion before this is marked verified."

- id: REQ-PERF-001
  type: performance
  statement: "The deterministic calculator has a warm-run p95 latency at or below 10 ms for a ten-criterion rubric on the documented local environment."
  fit_criterion:
    metric: "calculator_latency_ms_p95"
    threshold: "<= 10 ms p95 over 1000 warm calls"
    verification: "evidence/benchmark.json; docs/member-a/verification-results.md; rerun the local benchmark and record Python/OS and fixture"
  priority: Should
  source: "A proposal REQ-PERF-001; CS5351分工.md member A performance direction"
  tradeoff: "A local measured target is preferred over an unverified hardware-independent SLA."
  status: proposed
  owner: A
  notes: "Threshold accepted as a Should target; A must confirm the exact fixture and measured p95."

- id: REQ-PERF-002
  type: performance
  statement: "Every provider request uses a configured blocking-operation timeout of 30 seconds by default and performs exactly zero automatic retries; a timeout becomes an explicit escalation."
  fit_criterion:
    metric: "timeout_configuration_and_automatic_retry_count"
    threshold: "30 s default; 0 automatic retries"
    verification: "test/offline/test_http.py::HttpTests.test_delayed_header_times_out; test/offline/test_http.py::HttpTests.test_slow_trickle_is_stopped_by_connected_deadline; test/offline/test_feedback.py::FeedbackTests.test_transport_failure_escalates_without_retry_or_secrets"
  priority: Must
  source: "A proposal REQ-PERF-002; C consolidated"
  tradeoff: "A temporary provider failure needs a visible human-triggered retry instead of hidden retries and charges."
  status: proposed
  owner: A

- id: REQ-PERF-003
  type: performance
  statement: "Live inference meets a provisional p95 end-to-end latency target of 30 seconds over at least 20 measured attempts on the selected deployment, with failures reported separately."
  fit_criterion:
    metric: "live_end_to_end_latency_ms_p95"
    threshold: "<= 30000 ms p95 over >= 20 attempts"
    verification: "evidence/live-results.json; docs/member-a/live-verification.md; replay fixed cases and record model, prompt hash and environment"
  priority: Should
  source: "A proposal REQ-PERF-003; C consolidated"
  tradeoff: "The target remains provisional until the final deployment and prompt are frozen."
  status: proposed
  owner: A
  notes: "A historical run reports a much lower p95; D/E must confirm the deployment target before this becomes a release gate."

- id: REQ-COST-001
  type: cost
  statement: "An inference attempt makes at most one model request and supplies an output cap of 1024 tokens by default."
  fit_criterion:
    metric: "provider_call_count_and_requested_max_tokens"
    threshold: "<= 1 call per attempt; max_tokens = 1024 by default"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_valid_feedback_and_request_contract; inspect the actual request body in the local HTTP fixture"
  priority: Must
  source: "A proposal REQ-COST-001; C consolidated"
  tradeoff: "Shorter feedback and more escalations are preferred over unbounded output cost."
  status: proposed
  owner: A

- id: REQ-COST-002
  type: cost
  statement: "The assembled model context is checked against an explicit UTF-8 byte budget of 12000 bytes by default before any request; overflow makes zero model calls."
  fit_criterion:
    metric: "serialized_context_utf8_bytes"
    threshold: "<= 12000 bytes by default; 0 calls on overflow"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_context_boundary_counts_utf8_bytes; test/offline/test_feedback.py::FeedbackTests.test_input_and_monetary_budget_block_before_transport"
  priority: Must
  source: "A proposal REQ-COST-002; C consolidated"
  tradeoff: "A byte proxy is conservative and dependency-free but is not an exact provider token count."
  status: proposed
  owner: A

- id: REQ-COST-003
  type: cost
  statement: "Before inference, the system compares an estimated cost against a configured per-attempt budget using explicit input and output prices; an over-budget attempt makes zero calls."
  fit_criterion:
    metric: "preflight_estimated_cost_in_configured_currency"
    threshold: "estimate <= configured budget; 0 calls if over budget"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_input_and_monetary_budget_block_before_transport; test/offline/test_feedback.py::FeedbackTests.test_configuration_rejects_unsafe_endpoints_prices_and_limits"
  priority: Must
  source: "A proposal REQ-COST-003; C consolidated"
  tradeoff: "An application estimate is not a supplier billing guarantee; account-level spend limits remain separate."
  status: proposed
  owner: A

- id: REQ-COST-004
  type: cost
  statement: "Actual provider token usage, the configured estimate, prompt/model identity and elapsed time remain distinguishable for every attempt; missing or invalid usage is recorded as unknown, never as zero."
  fit_criterion:
    metric: "known_usage_or_explicit_unknown_rate"
    threshold: "100%; missing or invalid usage never recorded as zero"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_missing_or_invalid_usage_never_becomes_zero; test/offline/test_feedback.py::FeedbackTests.test_provider_over_output_cap_escalates_but_usage_survives"
  priority: Must
  source: "A proposal REQ-COST-004; C consolidated"
  tradeoff: "Providers without usable usage accounting cannot silently pass automatic feedback acceptance."
  status: proposed
  owner: A

- id: REQ-COST-005
  type: cost
  statement: "Long essays and over-budget attempts escalate visibly without truncating content, producing an automatic grade, or making a provider request."
  fit_criterion:
    metric: "over_limit_calls_and_automatic_grades"
    threshold: "0 calls; 0 automatic final grades; original content retained within the storage limit"
    verification: "test/offline/test_feedback.py::FeedbackTests.test_input_and_monetary_budget_block_before_transport; test/offline/test_calculator.py::CalculatorTests.test_file_bounds_encoding_and_essay"
  priority: Must
  source: "A proposal REQ-COST-005; C consolidated"
  tradeoff: "Long-text compaction is deferred to an approved D architecture change so summarization cannot erase grading evidence."
  status: proposed
  owner: A

