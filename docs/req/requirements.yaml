  owner: C
  notes: "D must confirm this as the quality-attribute scenario and add any missing measurable targets."

- id: REQ-QUAL-002
  type: quality
  statement: "Every approved grade is auditable: a reviewer can reconstruct the advisory scores, authoritative score, rubric and essay identity, and reviewer from durable records after a process restart."
  fit_criterion:
    metric: "unreconstructable_grade_record_count"
    threshold: "0"
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_audit_records_both_sources; test/offline/test_store.py::StoreTests.test_reopen_preserves_exact_record"
  priority: Must
  source: "Project brief auditability; C quality analysis pending D review"
  tradeoff: "Storing hashes and audit metadata adds record size but supports independent review."
  status: proposed
  owner: C

- id: REQ-QUAL-003
  type: quality
  statement: "The deterministic offline suite runs without network access or an API key, so grading logic and authority boundaries can be verified in a clean environment."
  fit_criterion:
    metric: "offline_tests_requiring_network_or_secret"
    threshold: "0"
    verification: "test/offline suite; docs/member-b/VALIDATION.md; CI offline job"
