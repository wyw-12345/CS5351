  tradeoff: "More orchestration code is accepted to keep the AI component non-authoritative."
  status: proposed
  owner: B

- id: REQ-INV-008
  type: invariant
  statement: "Retrying an approved identical submission is idempotent; conflicting content under the same submission identifier is rejected without overwriting the original grade."
  fit_criterion:
    metric: "duplicate_or_overwritten_grade_count"
    threshold: 0
    verification: "test/offline/test_authority_boundary.py::AuthorityTests.test_retry_is_idempotent; test/offline/test_store.py::StoreTests.test_duplicate_approval_cannot_overwrite_history"
