  owner: C

- id: REQ-QUAL-004
  type: quality
  statement: "The same inputs produce the same proposal and grade across separate processes and restarts; reopening the database preserves the exact audit record and score."
  fit_criterion:
    metric: "cross_process_score_or_record_differences"
    threshold: "0"
    verification: "test/offline/test_cli.py::CliTests.test_separate_process_restart_approval_and_duplicate_rejection; test/offline/test_store.py::StoreTests.test_reopen_preserves_exact_record"
  priority: Must
