decision_legend:
  accepted: "The proposal becomes a formal requirement, normally with the same ID."
  merged: "The proposal is absorbed by a stronger requirement; no duplicate formal ID is created."
  remapped: "The proposal becomes a formal requirement under a different ID."
  deferred: "The proposal is retained for discussion but not in the current baseline."
  rejected: "The proposal is not adopted; the reason must be recorded."

