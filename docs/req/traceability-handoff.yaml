blocking_rule:
  description: >
    The schema gate must first prove the registry validates. The traceability gate must then
    prove every requirement has a real test. C should not report a single green status for both.
  expected_current_result: "schema validation PASS; traceability BLOCKED"
  do_not:
    - "Do not add fake test files."
    - "Do not add test-map locators that do not contain the REQ ID in the test function docstring."
    - "Do not remove requirements to make the gate pass."
    - "Do not rewrite or weaken historical tests without a separately approved tests-only change."
