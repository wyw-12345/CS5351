name: GradeAide blocking gates

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gradeaide-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.gate }}
    runs-on: ${{ matrix.gate == 'regression' && 'ubuntu-26.04' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [test-approval, static-analysis, schema, semantic-evaluation, regression, ai-use-log]
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GRADEAIDE_LIVE: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-app.txt
      - run: python -m pip install -r requirements-ci.txt -r requirements-app.txt
      - name: Install bubblewrap for deployed isolation tests
        if: matrix.gate == 'regression'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          bwrap --version
      - name: Run blocking gate
        env:
          GATE: ${{ matrix.gate }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/run_ci_gate.py "$GATE"
      - name: Preserve mutation status
        if: always() && matrix.gate == 'regression'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/application-mutations.json
            artifacts/b-tool-mutations.json
          if-no-files-found: ignore
          retention-days: 14
